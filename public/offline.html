<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#006b57" />
    <title>ออฟไลน์ | PBRU POS</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f3f7f6;color:#16342e;font-family:system-ui,"Noto Sans Thai",sans-serif}.card{width:min(430px,100%);padding:34px 28px;border:1px solid #dce8e4;border-radius:28px;background:#fff;box-shadow:0 18px 50px #123b3217;text-align:center}.icon{width:92px;height:92px;margin:auto;display:grid;place-items:center;border-radius:26px;background:#006b57;color:#fff;font-size:44px}h1{margin:24px 0 8px;font-size:25px}p{margin:0;color:#668079;line-height:1.7}button{width:100%;min-height:50px;margin-top:24px;border:0;border-radius:15px;background:#07866f;color:#fff;font-size:16px;font-weight:800}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">⌁</div>
      <h1>อินเทอร์เน็ตขัดข้อง</h1>
      <p>ระบบไม่สามารถเชื่อมต่อข้อมูลกลางได้ในขณะนี้ โปรดตรวจสอบอินเทอร์เน็ตแล้วลองใหม่ เพื่อป้องกันออเดอร์ตกหล่น</p>
      <button type="button" onclick="location.reload()">ลองเชื่อมต่ออีกครั้ง</button>
    </main>
  </body>
</html>
