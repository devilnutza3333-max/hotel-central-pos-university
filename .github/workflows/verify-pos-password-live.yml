name: Verify live Login and self-password changes without touching users
on:
  push:
    branches: [main]
    paths:
      - "infra/pos-password-smoke-trigger.txt"
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Confirm production login navigation and protected password API
        shell: bash
        run: |
          set -euo pipefail
          base="https://hotel-central-pos-university.devilnutza3333.workers.dev"
          for i in $(seq 1 30); do
            register="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/pos-register.html" -w "%{http_code}" "$base/register" || true)"
            login="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/pos-login.html" -w "%{http_code}" "$base/login" || true)"
            passwordPage="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/pos-password.html" -w "%{http_code}" "$base/account/password" || true)"
            unauthorized="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/pos-unauthorized.json" -w "%{http_code}" -X POST "$base/api/auth/change-password" -H 'content-type: application/json' --data '{"oldPassword":"x","newPassword":"long-new-password","confirmPassword":"long-new-password"}' || true)"
            delivery="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/pos-delivery.json" -w "%{http_code}" "$base/api/delivery" || true)"
            native=0
            if grep -q 'href="/login"' "$RUNNER_TEMP/pos-register.html" && grep -q 'มีบัญชีแล้ว' "$RUNNER_TEMP/pos-register.html"; then native=1; fi
            echo "Attempt $i: register=$register login=$login passwordPage=$passwordPage unauthChange=$unauthorized delivery=$delivery nativeLoginLink=$native"
            if [[ "$register" == 200 && "$login" == 200 && "$passwordPage" == 200 && "$unauthorized" == 401 && "$delivery" == 200 && "$native" == 1 ]]; then
              echo "PASS: Native login link, login page, password change page and API authorization online; delivery unaffected"
              exit 0
            fi
            sleep 15
          done
          echo "::error::POS password change did not pass read-only production smoke"
          exit 1
