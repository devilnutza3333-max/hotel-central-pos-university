name: Test Hotel POS registration branch
on:
  push:
    branches: ["feature/pos-registration-20261121"]
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check role security and registration UI
        run: node --test tests/member-registration.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build Hotel POS Worker
        run: pnpm run build
