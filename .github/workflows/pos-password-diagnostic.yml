name: Diagnose POS password page deployment (read-only)
on:
  push:
    branches: [main]
    paths: ["infra/pos-password-diagnostic-trigger.txt"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: One-shot HTML and access control status check
        shell: bash
        run: |
          set -euo pipefail
          base="https://hotel-central-pos-university.devilnutza3333.workers.dev"
          for path in login register account/password; do
            status="$(curl -sS --connect-timeout 10 --max-time 20 -o "/tmp/pos-${path//\//-}.html" -w "%{http_code}" "$base/$path" || true)"
            echo "GET /$path = $status"
          done
          status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/pos-secret-guard.json -w "%{http_code}" -H 'content-type: application/json' --data '{"oldPassword":"not-a-password","newPassword":"new-strong-password","confirmPassword":"new-strong-password"}' "$base/api/auth/change-password" || true)"
          echo "POST /api/auth/change-password without login = $status"
          if grep -q 'href="/login"' /tmp/pos-register.html; then echo "Native Login href found"; else echo "Native Login href NOT present in returned HTML"; fi
          if grep -q 'มีบัญชีแล้ว' /tmp/pos-register.html; then echo "Thai Login text present"; else echo "Thai Login text not directly present"; fi
          echo "No account details or customer data read or changed"
