name: Prepare Hotel POS Cloudflare Configuration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Worker and D1 configuration (no deployment)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          name = 'hotel-central-pos-university'
          database_name = 'hotel-central-pos-db'
          database_id = 'bf87916e-6755-4a4b-8916-ad7a709c573b'
          binding = {'binding': 'DB', 'database_name': database_name, 'database_id': database_id}

          config = {
              '$schema': 'node_modules/wrangler/config-schema.json',
              'name': name,
              'main': './worker/index.ts',
              'compatibility_date': '2026-05-15',
              'compatibility_flags': ['nodejs_compat'],
              'keep_vars': True,
              'observability': {'enabled': True},
              'd1_databases': [binding],
          }
          Path('wrangler.jsonc').write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')

          path = Path('vite.config.ts')
          source = path.read_text()
          marker = '          ...localBindingConfig,\n'
          override = '''          ...localBindingConfig,
          ...(command === "build"
            ? {
                name: "hotel-central-pos-university",
                compatibility_date: "2026-05-15",
                keep_vars: true,
                d1_databases: [
                  {
                    binding: "DB",
                    database_name: "hotel-central-pos-db",
                    database_id: "bf87916e-6755-4a4b-8916-ad7a709c573b",
                  },
                ],
              }
            : {}),
          '''
          override = override.splitlines(keepends=True)
          override = override[0] + ''.join('          ' + line for line in override[1:])
          if '...(command === "build"' not in source:
              if source.count(marker) != 1:
                  raise SystemExit('STOP: vite.config.ts no longer matches reviewed source.')
              source = source.replace(marker, override, 1)
          else:
              if database_id not in source:
                  raise SystemExit('STOP: existing override differs.')
          path.write_text(source)
          print('Configuration prepared; no deployment.')
          PY
      - name: Commit configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wrangler.jsonc vite.config.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Configure Hotel POS Worker and D1'
            git push origin HEAD:main
          fi
