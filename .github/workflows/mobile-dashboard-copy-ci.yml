name: Verify mobile POS dashboard messaging
on:
  push:
    branches: ["feature/pos-mobile-dashboard-copy-20261121"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test role-aware mobile-first dashboard copy
        run: node --test tests/mobile-dashboard-copy.test.mjs tests/trainee-manager-privacy.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build Cloudflare Worker
        run: pnpm build
