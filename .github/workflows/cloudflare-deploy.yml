name: Deploy experimental Hotel Central POS to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "worker/**"
      - "db/**"
      - "drizzle/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-pos-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run POS regression tests
        run: node --test tests/cpu-patch.test.mjs tests/snapshot-scope.test.mjs

      - name: Build Cloudflare Worker
        run: pnpm run build

      # vinext/Vite can emit the same DB binding more than once when merging
      # Wrangler and Vite configs. Keep one only if all entries match the
      # pre-existing experimental database; refuse unexpected bindings.
      - name: Normalize generated D1 bindings safely
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "dist/server/wrangler.json";
          const conf = JSON.parse(fs.readFileSync(path, "utf8"));
          const entries = conf.d1_databases;
          const expected = {
            binding: "DB",
            database_name: "hotel-central-pos-db",
            database_id: "bf87916e-6755-4a4b-8916-ad7a709c573b",
          };
          if (!Array.isArray(entries) || entries.length === 0) {
            console.error("STOP: generated Worker config contains no D1 bindings.");
            process.exit(1);
          }
          if (!entries.every(item =>
            item.binding === expected.binding &&
            item.database_name === expected.database_name &&
            item.database_id === expected.database_id
          )) {
            console.error("STOP: D1 bindings differ from the expected experimental database. No deployment.");
            console.error(entries.map(({ binding, database_name, database_id }) => ({ binding, database_name, database_id })));
            process.exit(1);
          }
          conf.d1_databases = [entries[0]];
          // Build tooling may merge the same runtime compatibility flag twice.
          // Cloudflare rejects repeated flags with validation error 10021.
          const flags = conf.compatibility_flags ?? [];
          if (!Array.isArray(flags) || flags.some(flag => typeof flag !== "string" || !flag)) {
            console.error("STOP: invalid generated compatibility flags.");
            process.exit(1);
          }
          conf.compatibility_flags = [...new Set(flags)];
          fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          console.log(`Verified and normalized ${entries.length} identical D1 DB binding(s) to one.`);
          console.log(`Normalized compatibility flags from ${flags.length} to ${conf.compatibility_flags.length}: ${conf.compatibility_flags.join(", ")}`);
          NODE

      - name: Verify deployment target and existing D1 binding
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const conf = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
          const d1 = conf.d1_databases?.find(item => item.binding === "DB");
          const correctName = conf.name === "hotel-central-pos-university";
          const correctDb = d1?.database_name === "hotel-central-pos-db"
            && d1?.database_id === "bf87916e-6755-4a4b-8916-ad7a709c573b";
          if (!correctName || !correctDb) {
            console.error("STOP: Worker target or D1 binding differs from the existing test system.");
            process.exit(1);
          }
          console.log("Validated existing experimental Worker and D1 binding.");
          NODE

      - name: Confirm Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=One-time Cloudflare connection required::Set GitHub Actions Secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Do not paste tokens into chat or commit them to Git."
            exit 1
          fi

      - name: Deploy updated POS to existing Cloudflare Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json

      - name: Deployment summary
        run: |
          echo "Deployed Hotel Central POS to existing Worker: hotel-central-pos-university" >> "$GITHUB_STEP_SUMMARY"
          echo "Bound to existing experimental D1: hotel-central-pos-db" >> "$GITHUB_STEP_SUMMARY"
          echo "No database deletion, initialization or migration was run by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Test POS workflows and Cloudflare CPU error metrics after deploy." >> "$GITHUB_STEP_SUMMARY"
