name: Deploy Hotel POS to isolated Cloudflare staging

on:
  push:
    branches:
      - fix/pos-cpu-snapshots-20261113
    paths:
      - .github/workflows/cloudflare-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: Build and deploy isolated staging only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare connection
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Cloudflare connection required::In GitHub Settings > Secrets and variables > Actions, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Never paste the token into code or chat."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regression checks
        run: node --test tests/cpu-patch.test.mjs tests/snapshot-scope.test.mjs

      - name: Build
        run: pnpm run build

      - name: Find or create staging-only D1 database
        id: staging_db
        shell: bash
        run: |
          pnpm exec wrangler d1 list --json > /tmp/hotel-stage-d1-list.json
          STAGING_ID="$(node -e '
            const fs=require("node:fs");
            const result=JSON.parse(fs.readFileSync("/tmp/hotel-stage-d1-list.json", "utf8"));
            const list=Array.isArray(result)?result:(result.result??result.databases??[]);
            if(!Array.isArray(list)) process.exit(1);
            const database=list.find(x=>x.name==="hotel-central-pos-staging-db");
            process.stdout.write(database?.uuid??database?.id??"");
          ')"
          if [[ -z "$STAGING_ID" ]]; then
            pnpm exec wrangler d1 create hotel-central-pos-staging-db --location apac
            pnpm exec wrangler d1 list --json > /tmp/hotel-stage-d1-list.json
            STAGING_ID="$(node -e '
              const fs=require("node:fs");
              const result=JSON.parse(fs.readFileSync("/tmp/hotel-stage-d1-list.json", "utf8"));
              const list=Array.isArray(result)?result:(result.result??result.databases??[]);
              if(!Array.isArray(list)) process.exit(1);
              const database=list.find(x=>x.name==="hotel-central-pos-staging-db");
              process.stdout.write(database?.uuid??database?.id??"");
            ')"
          fi
          if [[ ! "$STAGING_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Staging D1 ID was not found. Stopping without deployment."
            exit 1
          fi
          echo "id=$STAGING_ID" >> "$GITHUB_OUTPUT"

      - name: Create deployment config isolated from production
        env:
          STAGING_D1_ID: ${{ steps.staging_db.outputs.id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const original = JSON.parse(fs.readFileSync('dist/server/wrangler.json','utf8'));
          const prod = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const prodId = prod.d1_databases?.find(x=>x.binding==='DB')?.database_id;
          const id = process.env.STAGING_D1_ID;
          if (!id || !prodId || id === prodId) throw Error('Refusing to bind staging to production D1');
          original.name = 'hotel-central-pos-staging';
          original.topLevelName = original.name;
          original.workers_dev = true;
          delete original.route;
          delete original.routes;
          delete original.triggers;
          delete original.account_id;
          original.vars = { ...(original.vars ?? {}), AUTH_PROVIDER: 'local' };
          original.d1_databases = [{
            binding: 'DB',
            database_name: 'hotel-central-pos-staging-db',
            database_id: id,
            migrations_dir: '../../drizzle'
          }];
          fs.writeFileSync('dist/server/wrangler.staging.json', JSON.stringify(original,null,2)+'\n');
          console.log('Prepared isolated Worker and D1 config (production untouched).');
          NODE

      - name: Apply migrations ONLY to staging D1
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.staging.json

      - name: Deploy ONLY the staging Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.staging.json

      - name: Next steps
        run: |
          echo "Staging Worker: hotel-central-pos-staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging D1: hotel-central-pos-staging-db (separate from production)" >> "$GITHUB_STEP_SUMMARY"
          echo "Production Worker/D1 were NOT updated." >> "$GITHUB_STEP_SUMMARY"
          echo "This staging database is new and does not contain production login accounts or sales data." >> "$GITHUB_STEP_SUMMARY"
          echo "Validate sign-in provisioning and POS workflows before deploying production." >> "$GITHUB_STEP_SUMMARY"
