name: Import Hotel POS Source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          mkdir -p /tmp/pos
          unzip -q hotel-pos-source.zip -d /tmp/pos
          test -f /tmp/pos/package.json
          cp -a /tmp/pos/. .
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || {
            git commit -m "Import POS source"
            git push
          }
