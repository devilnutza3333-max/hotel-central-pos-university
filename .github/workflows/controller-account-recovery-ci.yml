name: Test owner-only POS account recovery and one-time passwords
on:
  push:
    branches: ["feature/controller-account-recovery-20261121"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests for owner-only recovery
        run: node --test tests/controller-account-recovery.test.mjs tests/trainee-manager-privacy.test.mjs tests/member-profile.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build Worker
        run: pnpm build
      - name: Test account listing reset and roles on isolated LOCAL D1
        run: node scripts/test-pos-registration-local.mjs
