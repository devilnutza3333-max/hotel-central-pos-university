name: POS CPU patch verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/pos-cpu-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regression tests
        run: node --test tests/cpu-patch.test.mjs tests/snapshot-scope.test.mjs
      - name: Build only (never deploy)
        run: pnpm run build
