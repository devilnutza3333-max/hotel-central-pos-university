name: Test Hotel POS self-service password reset
on:
  push:
    branches: ["feature/pos-self-password-20261121"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test security and navigation
        run: node --test tests/self-password-change.test.mjs tests/member-registration.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build Worker
        run: pnpm run build
      - name: End-to-end register, manager delegation, password change and re-login on isolated D1
        run: node scripts/test-pos-registration-local.mjs
